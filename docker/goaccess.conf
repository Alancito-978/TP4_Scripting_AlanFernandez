# Formato de los registros de Nginx.
log-format COMBINED

# Archivo de logs que se analizará.
log-file /srv/logs/curza_access.log

# Archivo HTML que se generará.
output /srv/report/report.html

# Activar la actualización en tiempo real.
real-time-html true

# Dirección y puerto del servidor WebSocket.
addr 0.0.0.0
port 7890

# Título del informe.
html-report-title Análisis de tráfico web CURZA
