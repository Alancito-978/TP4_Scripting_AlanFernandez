services:
  web_server:
    image: nginx:alpine
    container_name: curza-web-server
    ports:
      - "8067:80"
      - "9067:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/usr/share/nginx/html:ro
      - nginx_logs:/var/log/nginx
      - goaccess_report:/usr/share/nginx/reports:ro
    restart: unless-stopped

  log_analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: curza-log-analyzer
    volumes:
      - nginx_logs:/srv/logs:ro
      - goaccess_report:/srv/report
    ports:
      - "7890:7890"
    depends_on:
      - web_server
    restart: unless-stopped

volumes:
  nginx_logs:
  goaccess_report:
