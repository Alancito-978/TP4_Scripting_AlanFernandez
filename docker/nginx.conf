events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Formato de registros compatible con GoAccess.
    log_format combined_custom
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent"';

    server {
        listen 80;
        server_name localhost;

        # Registro de solicitudes.
        access_log /var/log/nginx/curza_access.log combined_custom;

        # Página principal.
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        # Publicación del reporte de GoAccess.
        location = /report.html {
            alias /usr/share/nginx/reports/report.html;
        }
    }
}
